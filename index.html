*{box-sizing:border-box;min-width:0}

.tabs button small{display:block;font-weight:400;font-size:15px}
.tabs button[aria-selected=true]{background:#fff;color:#1559ad;border-color:#fff}
button:focus-visible{outline:3px solid #ffc845;outline-offset:2px}

.fig{position:relative;height:clamp(320px,50vh,480px);border-radius:20px;overflow:hidden;background:var(--land);border:1px solid var(--line)}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.hint{margin:6px 4px 0;color:var(--mute);font-size:15px}

.ctrl button{min-height:60px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 19px inherit;cursor:pointer}
.ctrl .go{background:var(--blue);border-color:var(--blue);color:#fff}
.ctrl button:disabled{opacity:.35;cursor:default}
.count{text-align:center;color:var(--mute);font-size:16px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.time{font-size:clamp(30px,7vw,38px);font-weight:800;line-height:1.1;color:var(--blueInk);white-space:nowrap}
.card h2{margin:6px 0 14px;font-size:24px;line-height:1.35}
.zh{background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.zh span{display:block;font-size:30px;font-weight:700;line-height:1.3}
.zh .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:6px}
.zh small{color:var(--mute);font-size:15px}
.copy{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--blue);background:transparent;color:var(--blueInk);font:800 16px inherit;cursor:pointer}
.how{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:14px;font-size:18px}
.pill{padding:4px 14px;border-radius:999px;font-weight:800;white-space:nowrap;background:var(--blue);color:#fff}
.ticket{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;border:2px solid var(--blue);border-radius:16px;padding:14px;margin-bottom:14px;background:var(--soft)}
.ticket div{display:flex;flex-direction:column}
.ticket small{color:var(--mute);font-size:15px}
.ticket b{font-size:19px}.ticket [lang=zh]{font-size:22px;font-weight:700}
.ticket em{font-style:normal;font-size:28px;font-weight:800;color:var(--blueInk);white-space:nowrap}
.ticket .arr{font-size:26px;color:var(--blueInk)}
.notes{margin:0;padding-left:22px}.notes li{margin:6px 0}
.toast{display:block;min-height:1.4em}
.zh span{-webkit-user-select:all;user-select:all}
.copy.ok{background:var(--blue);color:#fff}
.warn{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:light-dark(#fff3d1,#3a2f12);color:light-dark(#5c4300,#ffe3a1);border:1.5px solid light-dark(#f0c75e,#7a6123)}
.warn b{display:block}

.nm{font:800 16px "Noto Sans Thai",sans-serif;fill:#fff}
.nb{font:800 14px "Noto Sans Thai",sans-serif}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:center}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}}

function render(){

 $("count").textContent=`จุดที่ ${st.i+1} จาก ${n}`;
 $("prev").disabled=st.d===0&&st.i===0;
 $("next").textContent=last?(st.d<DAYS.length-1?"ไปวันถัดไป":"จบทริป"):"ต่อไป";$("next").disabled=last&&st.d===DAYS.length-1;
 let h=`<div class="time">${s.t}</div><h2>${s.n}</h2>`;
 h+=`<div class="how"><span class="pill">${ML[s.m]}</span>${s.h?`<span>${s.h}</span>`:""}</div>`;
 if(s.tk)h+=`<div class="ticket"><div><small>${s.m==="plane"?"ออกจาก":"ขึ้นที่สถานี"}</small><b>${s.tk.a}</b><span lang="zh">${s.tk.az}</span><em>${s.tk.d}</em></div><div class="arr" aria-hidden="true">→</div><div><small>${s.m==="plane"?"ถึง":"ลงที่สถานี"}</small><b>${s.tk.b}</b><span lang="zh">${s.tk.bz}</span><em>${s.tk.e}</em></div></div>`;
 if(s.warn)h+=`<p class="warn"><b>ควรระวัง</b>${s.warn}</p>`;
 if(s.zh)h+=`<div class="zh"><span lang="zh">${s.zh}</span><div class="row"><button type="button" class="copy" data-zh="${s.zh}">คัดลอกชื่อจีน</button><small class="toast" id="toast">${s.zhl||"ยื่นให้คนขับดูได้เลย"}</small></div></div>`;
 if(s.notes.length)h+=`<ul class="notes">${s.notes.map(x=>`<li>${x}</li>`).join("")}</ul>`;
 $("card").innerHTML=h;
 [...$("tabs").children].forEach((b,k)=>b.setAttribute("aria-selected",k===st.d));
}
function go(d,i){st={d,i};card();fly();try{localStorage.setItem("cqtrip3",JSON.stringify(st))}catch(e){}if(location.hash!=="#day"+(d+1))history.replaceState(null,"","#day"+(d+1))}
function next(){const n=DAYS[st.d].stops.length;if(st.i<n-1)go(st.d,st.i+1);else if(st.d<DAYS.length-1)go(st.d+1,0)}
function prev(){if(st.i>0)go(st.d,st.i-1);else if(st.d>0)go(st.d-1,DAYS[st.d-1].stops.length-1)}
$("tabs").innerHTML=DAYS.map((d,k)=>`<button role="tab" data-d="${k}">${d.tab}<small>${d.sub}</small></button>`).join("");
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(+b.dataset.d,0)});
$("next").addEventListener("click",next);$("prev").addEventListener("click",prev);
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")next();else if(e.key==="ArrowLeft")prev()});
function legacyCopy(t){const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";document.body.appendChild(ta);const y=window.scrollY;ta.focus({preventScroll:true});ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();window.scrollTo(0,y);return ok}
async function copyText(t){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(t);return true}catch(e){}}return legacyCopy(t)}
let copyTimer=0;
$("card").addEventListener("click",async e=>{const b=e.target.closest(".copy");if(!b)return;e.preventDefault();const t=$("toast"),z=b.dataset.zh;
 const ok=await copyText(z);clearTimeout(copyTimer);
 if(ok){b.textContent="คัดลอกแล้ว";b.classList.add("ok");t.textContent="วางในช่องค้นหาของ DiDi ได้เลย"}else{t.textContent="คัดลอกไม่ได้ ให้ยื่นจอให้คนขับดูแทน"}
 copyTimer=setTimeout(()=>{if(b.isConnected){b.textContent="คัดลอกชื่อจีน";b.classList.remove("ok")}},2500)});
window.addEventListener("hashchange",()=>{const m=location.hash.match(/^#day([1-4])$/);if(m&&+m[1]-1!==st.d)go(+m[1]-1,0)});
const ro=new ResizeObserver(()=>{if(!anim){cam=target();render()}});ro.observe(svg);
let start={d:0,i:0};try{const v=JSON.parse(localStorage.getItem("cqtrip3"));if(v&&DAYS[v.d]&&DAYS[v.d].stops[v.i])start=v}catch(e){}
const hm=location.hash.match(/^#day([1-4])$/);if(hm&&+hm[1]-1!==start.d)start={d:+hm[1]-1,i:0};
st=start;card();cam=target();render();
if(document.fonts)document.fonts.ready.then(()=>{if(!anim)render()});
}
</script>
